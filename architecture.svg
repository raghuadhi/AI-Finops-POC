<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font-size:22px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#64748b}
      .zoneLabel{font-size:13px;font-weight:700;fill:#334155}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:8}
      .boxTitle{font-size:14px;font-weight:700;fill:#0f172a}
      .boxText{font-size:11.5px;fill:#475569}
      .flow{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .zone{fill:none;stroke-width:1.5;stroke-dasharray:6 5;rx:12}
    </style>
  </defs>

  <text x="40" y="38" class="title">AI FinOps — Cost-per-Accepted-Task Observability with Langfuse</text>
  <text x="40" y="58" class="sub">Task Taxonomy v1 + Telemetry Spec v1  ·  self-hosted Langfuse (Docker Compose)</text>

  <!-- ZONE 1: AI workload / agents -->
  <rect x="30" y="80" width="330" height="330" class="zone" stroke="#6366f1"/>
  <text x="46" y="104" class="zoneLabel" fill="#6366f1">1 · AI WORKLOAD (one or many agents)</text>

  <!-- hierarchy boxes -->
  <rect x="60" y="120" width="270" height="44" class="box"/>
  <text x="74" y="140" class="boxTitle">session / conversation</text>
  <text x="74" y="156" class="boxText">user_id · tenant.id · session_id</text>

  <rect x="80" y="178" width="250" height="44" class="box"/>
  <text x="94" y="198" class="boxTitle">task  (unit of accounting)</text>
  <text x="94" y="214" class="boxText">task.id · task.type · attempt · parent_id</text>

  <rect x="100" y="236" width="230" height="40" class="box"/>
  <text x="114" y="254" class="boxTitle">step  (agent-loop iteration)</text>
  <text x="114" y="269" class="boxText">one span</text>

  <rect x="120" y="290" width="210" height="58" class="box"/>
  <text x="134" y="309" class="boxTitle">call</text>
  <text x="134" y="325" class="boxText">model · tool · retrieval ·</text>
  <text x="134" y="339" class="boxText">rerank · guardrail  (+ gen_ai.* usage)</text>

  <text x="60" y="378" class="boxText">Emitted via Langfuse Python SDK (OTel-based).</text>
  <text x="60" y="394" class="boxText">Each call stamped with required spec attributes.</text>

  <!-- arrow from workload to langfuse -->
  <path class="flow" d="M360 250 L430 250"/>
  <text x="366" y="242" class="boxText">telemetry</text>

  <!-- ZONE 2: Langfuse platform -->
  <rect x="430" y="80" width="420" height="500" class="zone" stroke="#0ea5e9"/>
  <text x="446" y="104" class="zoneLabel" fill="#0ea5e9">2 · LANGFUSE PLATFORM (self-hosted containers)</text>

  <rect x="455" y="120" width="170" height="60" class="box"/>
  <text x="469" y="142" class="boxTitle">Web</text>
  <text x="469" y="158" class="boxText">UI + ingestion API</text>
  <text x="469" y="173" class="boxText">:3000</text>

  <rect x="655" y="120" width="170" height="60" class="box"/>
  <text x="669" y="142" class="boxTitle">Worker</text>
  <text x="669" y="158" class="boxText">async event</text>
  <text x="669" y="173" class="boxText">processing</text>

  <!-- data stores -->
  <rect x="455" y="210" width="170" height="60" class="box"/>
  <text x="469" y="232" class="boxTitle">Postgres</text>
  <text x="469" y="248" class="boxText">users · projects ·</text>
  <text x="469" y="263" class="boxText">API keys (metadata)</text>

  <rect x="655" y="210" width="170" height="60" class="box"/>
  <text x="669" y="232" class="boxTitle">ClickHouse</text>
  <text x="669" y="248" class="boxText">traces · observations ·</text>
  <text x="669" y="263" class="boxText">scores (analytics)</text>

  <rect x="455" y="300" width="170" height="60" class="box"/>
  <text x="469" y="322" class="boxTitle">Redis</text>
  <text x="469" y="338" class="boxText">queue · cache</text>

  <rect x="655" y="300" width="170" height="60" class="box"/>
  <text x="669" y="322" class="boxTitle">MinIO (S3)</text>
  <text x="669" y="338" class="boxText">event payload blobs</text>

  <!-- internal flows -->
  <path class="flow" d="M625 150 L655 150"/>
  <path class="flow" d="M740 180 L740 210"/>
  <path class="flow" d="M540 180 L540 210"/>
  <path class="flow" d="M625 330 L655 330"/>

  <!-- UI / outputs -->
  <rect x="455" y="400" width="370" height="150" class="box"/>
  <text x="469" y="422" class="boxTitle">Langfuse UI  (localhost:3000)</text>
  <text x="469" y="444" class="boxText">• Tracing — session → task → step → call drill-down</text>
  <text x="469" y="462" class="boxText">• Sessions &amp; Users — per-session / per-user attribution</text>
  <text x="469" y="480" class="boxText">• Model costs — cost + tokens by model</text>
  <text x="469" y="498" class="boxText">• Scores — task.accepted (acceptance rate) &amp; cost.usd_computed</text>
  <text x="469" y="516" class="boxText">• Dashboards &amp; Alerts</text>
  <text x="469" y="538" class="boxText">Read path: ClickHouse → Web → UI</text>

  <path class="flow" d="M740 360 L740 400"/>
  <path class="flow" d="M540 360 L540 400"/>

  <!-- ZONE 3: FinOps cost engine -->
  <rect x="890" y="80" width="200" height="500" class="zone" stroke="#16a34a"/>
  <text x="906" y="104" class="zoneLabel" fill="#16a34a">3 · FINOPS COST ENGINE</text>

  <rect x="910" y="130" width="160" height="80" class="box"/>
  <text x="924" y="152" class="boxTitle">Collector</text>
  <text x="924" y="170" class="boxText">derives:</text>
  <text x="924" y="185" class="boxText">cost.usd_computed</text>
  <text x="924" y="200" class="boxText">cost.inr_computed</text>

  <rect x="910" y="240" width="160" height="80" class="box"/>
  <text x="924" y="262" class="boxTitle">Price Book</text>
  <text x="924" y="280" class="boxText">versioned by</text>
  <text x="924" y="295" class="boxText">cost.price_book_</text>
  <text x="924" y="310" class="boxText">version (date)</text>

  <rect x="910" y="350" width="160" height="95" class="box"/>
  <text x="924" y="372" class="boxTitle">Formula</text>
  <text x="924" y="390" class="boxText">Σ cost(all attempts)</text>
  <text x="924" y="405" class="boxText">÷ accepted tasks</text>
  <text x="924" y="424" class="boxText">= cost / accepted</text>
  <text x="924" y="439" class="boxText">+ acceptance rate</text>

  <rect x="910" y="470" width="160" height="90" class="box"/>
  <text x="924" y="492" class="boxTitle">Future</text>
  <text x="924" y="510" class="boxText">reconcile vs</text>
  <text x="924" y="525" class="boxText">AWS bill (Bedrock</text>
  <text x="924" y="540" class="boxText">ARN / CUR)</text>

  <!-- price book -> collector, collector attaches cost to telemetry -->
  <path class="flow" d="M990 240 L990 210"/>
  <path class="flow" d="M910 170 L855 170" />
  <text x="860" y="162" class="boxText">cost</text>
  <path class="flow" d="M990 350 L990 320"/>

  <!-- footer legend -->
  <text x="40" y="620" class="sub">Flow: agents emit session→task→step→call telemetry → Langfuse ingests &amp; stores → Collector prices each call from the versioned price book →</text>
  <text x="40" y="640" class="sub">cost + acceptance surfaced in the UI as metadata and scores. POC uses sample token counts; cost logic &amp; schema are real and unit-tested.</text>

  <text x="40" y="690" class="sub" font-weight="700" fill="#334155">Key join keys:</text>
  <text x="150" y="690" class="sub">task.id (call ↔ cost ↔ accepted) · session_id (session rollup) · user_id (per-user) · tenant.id (multi-tenant) · task.parent_id (multi-agent sub-tasks)</text>
</svg>
